name: Verify local MVP
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m scripts.verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: experiments/verification.json
