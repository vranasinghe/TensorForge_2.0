# Render Blueprint: one free HTTPS API replica.
# Set API_KEY in the dashboard when prompted. Never put the evaluation key here.
#
# Free instances are 512 MB. The vote/urg_v3 artifact expands well past that
# (ten calibrated pipelines), so this service loads artifacts/baseline instead.
# Job state is ephemeral and the instance sleeps when idle.

services:
  - type: web
    name: tensorforge-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    numInstances: 1
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: API_KEY
        sync: false
      - key: ARTIFACT_DIR
        value: /srv/artifacts/baseline
      - key: JOB_DB
        value: /srv/runtime/jobs.sqlite3
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
