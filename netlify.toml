# Netlify hosts only the private demo. The browser talks to same-origin /api/*
# and a serverless function injects API_KEY when it calls the Render backend.
# The evaluation key never ships in frontend JavaScript.

[build]
  command = "mkdir -p site && cp frontend/index.html site/index.html"
  publish = "site"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/proxy/:splat"
  status = 200
  force = true

[[edge_functions]]
  path = "/*"
  function = "protect"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"
    Cache-Control = "no-store"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'"
